name: Android app

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "pc/tacocam/**"
      - "pc/tools/android_e2e.py"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: true

# The job only reads the code. Actions are pinned to exact commits (a moved tag can't change what runs);
# Gradle itself is checked against the SHA-256 in gradle-wrapper.properties.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Build the app and run its tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          ls -la app/build/outputs/apk/release/

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: PC packages (the engine's; the window and the Windows camera aren't needed here)
        run: python -m pip install "av==19.0.2" "numpy>=2.0" opencv-python-headless "Pillow>=10.0"

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator: the PC engine installs, opens and streams from the app
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: python pc/tools/android_e2e.py --apk android/app/build/outputs/apk/release/app-release.apk --save android-e2e.png

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: TacoCam-android
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android-e2e.png
            android/app/build/reports/tests/
          if-no-files-found: warn
